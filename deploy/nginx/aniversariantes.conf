# Etapa 2 de 2 — Birthday Celebrants em HTTPS.
#
# Vive no conf.d do nginx da stack `contactia` (bind-mount), não aqui:
#   cp deploy/nginx/aniversariantes.conf ~/contactia/app/deploy/nginx/conf.d/
#   docker compose -f ~/contactia/app/docker-compose.yml exec nginx nginx -t
#   docker compose -f ~/contactia/app/docker-compose.yml exec nginx nginx -s reload
#
# Certificado em lineage própria (aniversariantes.contactia.com.br), renovado
# pelo cron mensal da stack `contactia` junto com os demais.
#
# NÃO adicionar X-Frame-Options aqui: o painel roda em iframe da plataforma, e
# quem controla quem pode embutir é a CSP `frame-ancestors` que o próprio app
# manda (next.config.ts). Um X-Frame-Options no nginx bloquearia o iframe.

server {
    listen 80;
    server_name aniversariantes.contactia.com.br;

    # Renovação do certificado passa por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aniversariantes.contactia.com.br;

    ssl_certificate     /etc/letsencrypt/live/aniversariantes.contactia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aniversariantes.contactia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # O upstream vai numa VARIÁVEL, resolvida a cada request pelo DNS do Docker.
    #
    # Com `proxy_pass http://birthday-celebrants:3000` literal, o nginx resolve o
    # nome ao CARREGAR a config: se este container estiver parado num restart do
    # nginx, o nginx inteiro não sobe — e leva junto ligações, Clinic Control e
    # calendário, que dividem o mesmo nginx. Com a variável, só este domínio
    # responde 502 enquanto o container não volta.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $bc_upstream http://birthday-celebrants:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sem Upgrade/Connection: o app não usa WebSocket. `Connection ""` mantém o
    # keep-alive com o upstream.
    proxy_set_header Connection "";

    # A sincronização da Clinicorp chama a API externa dia a dia e paciente a
    # paciente; passa fácil do timeout padrão de 60s. O cron chama por aqui.
    location /api/cron/ {
        proxy_pass $bc_upstream;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass $bc_upstream;
        # Agendamento em lote é sequencial (limite de taxa da plataforma de
        # mensagens): até 100 pacientes numa request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
