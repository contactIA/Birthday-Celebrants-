# Etapa 1 de 2 — só HTTP, para o Let's Encrypt validar o domínio.
#
# O nginx da stack `contactia` não sobe (nem recarrega) com um `ssl_certificate`
# que ainda não existe. Por isso este bloco provisório vem primeiro, o certbot
# emite o certificado pelo webroot, e só então entra aniversariantes.conf.
#
# Vive no conf.d da stack `contactia` (bind-mount):
#   cp deploy/nginx/aniversariantes-bootstrap.conf \
#      ~/contactia/app/deploy/nginx/conf.d/aniversariantes.conf

server {
    listen 80;
    server_name aniversariantes.contactia.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
